<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
	<title>Checkpoint đầu để học làm web</title>
	<link rel="stylesheet" href="style/style.css">
</head>
<body>
	<header id="header">
		<img src="assets/logos/logo.jpg" alt="Web Logo">
		<h1>Quang's Small Website</h1>
	</header>
	<nav id="navbar">
		<a href="#">Home</a>
		<a href="#">Pages</a>
		<a href="#">Info</a>
		<a href="#">About</a>
	</nav>
	<main id="main">
		<section id="section">
			<h2>This is just a section</h2>
		</section>
		<article id="article">
			<button id="get-weather-btn" onclick="showWeather()">Get Weather</button> 
			<select id="selector">
				<option value=""></option>
				<option value="New York">New York</option>
				<option value="Los Angeles">Los Angeles</option>
				<option value="Chicago">Chicago</option>
				<option value="Paris">Paris</option>
				<option value="Tokyo">Tokyo</option>
				<option value="London">London</option>
			</select>
			<br>
			<div class="weather-forecast">
				<img id="weather-icon"></img>
				<span id="main-temperature">Main Temp: </span>
				<span id="feels-like">Feels Like:</span>
				<span id="humidity">Humidity:</span>
				<span id="wind">Wind: </span>
				<span id="wind-gust">Wind gust: </span>
				<span id="weather-main">Weather main:</span>
				<span id="location">Location: </span>
			</div>
		</article>
		<aside id="aside">
			<h2>This is header for aside</h2>
		</aside>
	</main>
	<footer id="footer">
		<a href="#">Contact Us</a> |
		<a href="#">Lorem Ispum</a>
	</footer>
	<script type="module" src="scripts/main.js"></script>
</body>
</html>
